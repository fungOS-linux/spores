[package]
name = "doc-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "A native inspector for the fungos-vfs document layer"

# Its own workspace on purpose: the Spore guests in this repository build against
# the headless `gpui` 0.2.2 fork for wasm32-wasip2, and a native window builds
# against `gpui-kit`'s pinned `gpui-pre` snapshot. Those are different crates and
# their types do not unify, so sharing a lockfile would only make the mismatch
# somebody else's build failure. Same reason adapters/delta-acp is its own
# workspace in colony.
[workspace]
# The staged doc layer is its own workspace root; it is a dependency, not a
# member.
exclude = ["vendor"]

[[bin]]
name = "doc-shell"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The house component library. The fork pin is what decides which `gpui-pre`
# snapshot this app compiles against; see README.md.
gpui-kit = { git = "https://github.com/fungOS-linux/gpui-kit", tag = "v0.9.1" }
# The document layer, staged read-only by scripts/vendor-doc-layer.sh.
fungos-vfs = { path = "vendor/fungos-vfs" }

[dev-dependencies]
tempfile = "3"
