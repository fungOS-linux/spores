[package]
name = "doc-shell-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "doc-shell as a Spore: a Word document read from its own bytes"

# Its own workspace, for the same reason the finder has one: a Spore is a
# `wasm32-wasip2` component built against the fork's headless `gpui`, and the
# native app two directories up builds against the same fork's desktop platform.
# Sharing a lockfile would make one build fail on the other's features.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# Render the window against a fixed vault, for a host that has not linked
# `soil:vfs`. Never the shipped Spore — see `src/data.rs`.
demo = []

[dependencies]
anyhow = "1"
# The document layer's reader, reduced to what a guest needs: a `.docx` is a zip
# of XML parts, and reading one is a parse, not a database.
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
gpui = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "60ebb175729ad2a17acf59d8e988e794ff4b7eb4", package = "gpui", default-features = false, features = ["headless"] }
gpui_wgpu = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "60ebb175729ad2a17acf59d8e988e794ff4b7eb4", package = "gpui_wgpu", features = ["headless"] }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
wgpu-wasi-webgpu = { git = "https://github.com/fungOS-linux/wgpu-wasi-webgpu", rev = "bec921356c366450408d5faee2d206b6a1b8061b" }
wit-bindgen = "0.57"
# The house component library, pinned to the fork revision that builds against
# the same headless `gpui` a Spore gets.
gpui-component = { git = "https://github.com/fungOS-linux/gpui-kit", rev = "8feed9ee6526d0ee8e7b3e11349290b3d38319ed", package = "gpui-component", default-features = false }
