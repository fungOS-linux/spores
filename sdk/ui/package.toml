# The Spore UI library, as a versioned package rather than a copy per Spore.
#
# Every Spore that draws a panel had its own copy of this file, which is how two
# apps in one shell end up disagreeing about what a gap is. One package, one
# version, one set of answers.
schema = 1
name = "fungos.ui"
version = "0.5.0"
license = "MIT OR Apache-2.0"
entry = "ui.lua"
summary = "Declarative, theme-driven UI for Spores: layout, components, tokens, and dashboard nodes"

# Composed into a Spore's UI at build time. The host JITs the result, so a
# component change is an artifact change, not a compositor rebuild.
kind = "ui-library"
