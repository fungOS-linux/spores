[workspace]
# spores/contacts is its own workspace root (it pins wit-bindgen separately and
# builds to its own target dir), so it is deliberately absent from this list.
members = ["spores/cli-http", "spores/hue-client", "spores/infinitime", "spores/watch-core", "spores/hue", "spores/lights-core", "spores/spotify", "spores/tui", "spores/dragshift", "spores/search", "spores/markdown", "spores/unibus", "spores/worklog", "spores/pulse", "spores/fleet", "spores/spore-browser", "spores/spore-catalog", "spores/terminal-core", "spores/terminal", "spores/spore-browser-host", "spores/launcher", "spores/launcher-host", "spores/chrome-host", "spores/files", "spores/spore-serve"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fungOS-linux/spores"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
