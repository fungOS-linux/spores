[workspace]
members = ["spores/markdown", "spores/unibus", "spores/terminal-core", "spores/terminal", "spores/terminal-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fungOS-linux/spores"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
