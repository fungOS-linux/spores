[workspace]
# spores/contacts is its own workspace root (it pins wit-bindgen separately and
# builds to its own target dir), so it is deliberately absent from this list.
members = ["spores/markdown", "spores/unibus", "spores/launcher", "spores/terminal-core", "spores/terminal", "spores/terminal-host", "spores/launcher-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fungOS-linux/spores"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
