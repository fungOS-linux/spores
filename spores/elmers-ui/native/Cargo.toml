[package]
name = "elmers-ui-preview"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace: the Spore next door pins gpui for a wasm component, and a
# shared resolver would drag that feature set into a desktop build.
[workspace]

[dependencies]
gpui = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "60ebb175729ad2a17acf59d8e988e794ff4b7eb4", package = "gpui" }
gpui_platform = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "60ebb175729ad2a17acf59d8e988e794ff4b7eb4", package = "gpui_platform", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
