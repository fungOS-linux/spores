# Rooms: shared audio/video spaces with a Holodeck twin.
#
# Rooms, membership, admission and the conversation live in this module, in
# records. Canvas renders the Lua view; the host maps the `rooms` namespace to
# a book and enforces the grant. Media and LiveKit credentials stay host-side:
# a Spore asks for a scoped token, it never signs one.
schema = 1

[spore]
id = "dev.fungos.rooms"
name = "rooms"
version = "0.1.0"
license = "MIT"
summary = "Shared audio/video rooms with a Holodeck twin"
homepage = "https://github.com/fungOS-linux/spores"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { canvas = "1.0.0", records = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/rooms.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "web"]

[grants]
"soil:canvas" = "present the room directory, buses and the selected room"
"soil:records" = "own rooms, membership, messages and admission in the rooms namespace"

# Media is host-owned. The room adapter uses soil:mic, soil:camera and
# soil:screencast internally; this Spore receives state and surface aliases,
# and asks soil:creds for a room-scoped media token.

[denied]
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]

[presentation]
badge = "R"
color = "#7fc7a8"
