# Rooms: shared audio/video spaces with a Holodeck twin. This is the Canvas
# presenter. It owns composition, not room state, media or transport; the
# module and grants land with `soil:room`.
schema = 1

[spore]
id = "dev.fungos.rooms"
name = "rooms"
version = "0.1.0"
license = "MIT"
summary = "Shared audio/video rooms with a Holodeck twin"
homepage = "https://github.com/fungOS-linux/spores"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { canvas = "1.0.0" }

[ui]
entry = "ui/rooms.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "web"]

[grants]
"soil:canvas" = "present the room directory, buses and the selected room"

# When the module lands, the room grants are added with reasons. They are named
# here so a reviewer sees the intended boundary, not merely its current absence.
# "soil:room" = "list and join rooms, read presence, buses and room events"
# "soil:room.media" = "publish and hear room audio through the host"
# "soil:surface-import" = "place shared screens in the room view"
# "soil:records" = "read the room conversation thread"

# Capture is host-owned. The room adapter uses soil:mic, soil:camera and
# soil:screencast internally; this Spore receives state and surface aliases.

[denied]
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]

[presentation]
badge = "R"
color = "#7fc7a8"
