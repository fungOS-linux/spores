# Calendar Spore over soil:records. See docs/soil-records.md.
schema = 1

[spore]
id = "dev.fungos.calendar"
name = "calendar"
version = "0.1.0"
license = "MIT"
summary = "Week, agenda and month calendar from the local records book"
homepage = "https://github.com/fungOS-linux/spores"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { records = "0.1.0", canvas = "1.0.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/calendar.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
canvas_module = "spore-dev-calendar"
surfaces = ["web", "native", "canvas"]

[grants]
"soil:records.read" = "read the calendar event collection"
"soil:canvas" = "present the calendar surface"

[denied]
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]

[presentation]
badge = "K"
color = "#f0a35e"
