[package]
name = "spore-calendar"
description = "Calendar Spore over soil:records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
rrule = "0.14"
serde_json = "1"
wit-bindgen = "0.41"

[lints.rust]
unsafe_code = "allow"
