[package]
name = "contacts-host"
description = "Wasmtime host for the contacts Spore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "contacts-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
soil-records-host = { git = "https://github.com/fungOS-linux/soil.git", rev = "c04a8883b26d219d80f06432ab4dbe1b2f38a698" }
