<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SFX</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18191c;color:#f1f2f4;font:13px ui-monospace,monospace}
    canvas{display:block;width:100%;height:100%}
    #status{position:fixed;right:16px;bottom:12px;color:#adb3bd;pointer-events:none}
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="status">ready</div>
<script>
const PALETTE = {
  background:[24,25,28], surface:[32,34,38], text:[241,242,244], muted:[173,179,189],
  primary:[131,203,220], success:[126,211,161], warning:[239,191,112], danger:[255,157,170],
};
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
let scene = null, hits = [], dpr = 1;
const EXCLUDE = /^(pad-mark|pad-name|pad-detail|pad-room|pad-key-text|pad-key)-/;

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  draw();
}

function color(ink, fallback) {
  const c = PALETTE[ink] || PALETTE[fallback] || PALETTE.text;
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function draw() {
  if (!scene) return;
  const w = canvas.width, h = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = color('background');
  ctx.fillRect(0, 0, w, h);
  const nodes = [...(scene.nodes || [])].sort((a, b) =>
    (a.transform?.translation?.[2] || 0) - (b.transform?.translation?.[2] || 0));
  for (const node of nodes) {
    const t = node.transform || {};
    const [tx, ty] = t.translation || [0, 0, 0];
    const [sx, sy] = t.scale || [1, 1, 1];
    const x = (tx + 4) / 8 * w;
    const y = (1 - (ty + 4) / 8) * h;
    if (node.type === 'rect') {
      const rw = Math.max(1, Math.abs(sx) / 8 * w);
      const rh = Math.max(1, Math.abs(sy) / 8 * h);
      const radius = Math.min((node.radius || 0) / 8 * w, rw / 2, rh / 2);
      ctx.globalAlpha = node.opacity ?? 1;
      ctx.fillStyle = color(node.ink, 'surface');
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, rw, rh, radius);
      else ctx.rect(x, y, rw, rh);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (node.type === 'text') {
      const size = Math.max(8, Math.abs(sx) * 16 * 1.25);
      ctx.fillStyle = color(node.ink, 'text');
      ctx.font = `${size}px ui-monospace,monospace`;
      ctx.textBaseline = 'top';
      ctx.fillText(node.text || '', x, y);
    }
  }
}

function padAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width;
  const y = (clientY - rect.top) / rect.height;
  const nx = x * 8 - 4;
  const ny = 4 - y * 8;
  for (const hit of hits) {
    if (!hit.id?.startsWith('sfx-pad-')) continue;
    if (nx >= hit.x && nx <= hit.x + hit.width &&
        ny <= hit.y && ny >= hit.y - hit.height) {
      return hit.id.slice('sfx-pad-'.length);
    }
  }
  return null;
}

canvas.addEventListener('click', async (event) => {
  const pad = padAt(event.clientX, event.clientY);
  if (!pad) return;
  status.textContent = `play · ${pad}`;
  try {
    const response = await fetch('/act', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'sfx.trigger', pad }),
    });
    if (!response.ok) throw new Error(`host answered ${response.status}`);
    const snapshot = await response.json();
    status.textContent = snapshot.status?.last_error || `last · ${snapshot.status?.last_pad || pad}`;
  } catch (error) {
    status.textContent = `host error: ${error}`;
  }
});

addEventListener('resize', resize);
Promise.all([
  fetch('/scene.json').then((response) => response.json()),
  fetch('/scene.json.hits.json').then((response) => response.json()),
]).then(([present, targets]) => {
  scene = present;
  hits = targets;
  resize();
}).catch((error) => { status.textContent = `scene error: ${error}`; });
</script>
</body>
</html>
