[package]
name = "terminal-host"
description = "Mock Mycelium + terminal host for the terminal Spore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "terminal-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
portable-pty = "0.9"
minifb = "0.28"
font8x8 = "0.3"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
terminal-core = { path = "../terminal-core" }
