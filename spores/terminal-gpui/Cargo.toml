[package]
name = "terminal-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "eef6434a7a839948585ec75e0a8bb0149c20fc45", package = "gpui", default-features = false, features = ["headless"] }
gpui_wgpu = { git = "https://github.com/fungOS-linux/gpui-fast", rev = "eef6434a7a839948585ec75e0a8bb0149c20fc45", package = "gpui_wgpu", features = ["headless"] }
terminal-core = { path = "../terminal-core" }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
wgpu-wasi-webgpu = { git = "https://github.com/fungOS-linux/wgpu-wasi-webgpu", rev = "bec921356c366450408d5faee2d206b6a1b8061b" }
wit-bindgen = "0.57"
