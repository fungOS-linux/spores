[package]
name = "spore-terminal"
description = "Mycelium directory + VT terminal in a Soil Spore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-core = { path = "../terminal-core" }
wit-bindgen = "0.41"

# wit-bindgen emits unsafe shims and export_name; isolate that to this Spore.
[lints.rust]
unsafe_code = "allow"
