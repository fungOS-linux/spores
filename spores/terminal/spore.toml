# Terminal Spore: Mycelium directory + libghostty-compatible VT surface.
schema = 1

[spore]
id = "dev.fungos.terminal"
name = "terminal"
version = "0.1.0"
license = "MIT"
summary = "Browse Mycelium targets and open a terminal session"
description = "A terminal that lists the Mycelium targets this machine may reach and opens a host-mediated session, without ever holding SSH credentials itself."
homepage = "https://github.com/fungOS-linux/spores"

[docs]
usage = ["terminal", "terminal --version"]
man = "docs/man.md"

[catalog]
categories = ["developer-tools", "utilities"]
keywords = ["terminal", "ssh", "mycelium", "shell"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { mycelium = "0.1.0", terminal = "0.1.0" }

[module]
path = "module.wasm"

[ui]
# The terminal itself. `ui/terminal.lua` stays as the status/fallback projection
# for a surface that cannot draw a grid.
entry = "ui/grid.lua"
jit = true
hot_reload = true

[launch]
# The terminal is a host-rendered surface: the Spore owns the VT and the
# target directory, and the native host owns Mycelium, the PTY and the grid.
default = "native"
surfaces = ["web", "native"]
native = "terminal-host"

[grants]
"soil:mycelium" = "list Mycelium targets visible to this Spore; open a host-mediated SSH PTY to a listed target; run a non-interactive command on a listed target"
"soil:terminal" = "present a bounded cell grid and receive normalized input"

"wasi:cli" = "Rust std diagnostics; no args, environment, or process launch"
"wasi:clocks" = "monotonic timing for the guest's scheduler"
"wasi:io" = "component-model async transport"
[denied]
# SSH, credentials, routes and host keys stay in the Mycelium host capability.
transport = ["socket", "quic", "iroh", "ssh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]

[presentation]
badge = "T"
color = "#8bd5ca"
# The package's own mark: a file in the package, so a launcher draws it
# with no network and the lock covers it. `icon` stays the CID form a
# store fetches.
mark = "assets/icon.svg"
