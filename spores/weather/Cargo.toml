[package]
name = "weather-spore"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
weather-protocol = { path = "protocol" }
serde_json = "1"
wit-bindgen = "0.41"

# wit-bindgen emits unsafe shims and export_name; isolate that to this Spore.
[lints.rust]
unsafe_code = "allow"

# The protocol crate is where the record and the WMO table live, so its
# tests are part of a plain `cargo test` here.
[workspace]
members = [".", "protocol"]
default-members = [".", "protocol"]
