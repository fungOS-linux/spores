[package]
name = "terminal-core"
description = "VT grid conversion shared by the terminal Spore and its native mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = { version = "0.15", optional = true }
unicode-width = "0.2"

[features]
default = ["vt100"]
vt100 = ["dep:vt100"]
