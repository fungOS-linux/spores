# Spore manifest, schema 1. See fungOS-linux/soil docs/spore-package.md.
#
# A grant is a statement of intent reviewed with the pull request, not a
# capability the Spore can widen at runtime.

schema = 1

[spore]
id = "dev.fungos.markdown"
name = "markdown"
version = "0.1.0"
license = "MIT"
summary = "Markdown reader/editor with a hot-reloadable Lua UI"
description = "Read and edit Markdown as one document. Rust owns the model, Lua owns every pixel, so a running editor can be restyled without a rebuild."
homepage = "https://github.com/fungOS-linux/spores"

[docs]
usage = ["markdown [FILE]", "markdown --version"]
man = "docs/man.md"

[catalog]
categories = ["productivity"]
keywords = ["markdown", "editor", "notes", "documents"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { canvas = "1.0.0", storage = "1.0.0" }

# Produced by the Soil guest build, then covered by spore.lock.
[module]
path = "module.wasm"

# The UI is an artifact, not part of the module. Canvas JITs it, recompiles on
# digest change, and records which UI revision produced a view.
[ui]
entry = "ui/editor.lua"
jit = true
hot_reload = true

# Which host Soil launches. The Spore and its UI are identical on all three.
[launch]
default = "canvas"
surfaces = ["web", "native", "canvas"]

[grants]
"soil:canvas" = "present the reader/editor surface"
"soil:time" = "debounced autosave"
"soil:storage" = "open and save documents by DocId"

# Planned when soil:vfs lands. The Spore already uses the same Vfs boundary.
# "soil:vfs" = "read and write documents by DocId"

[assets]
# Content is declared here so the lock covers it. Empty until the first asset.
# "site-map" = { path = "assets/site-map.png", media_type = "image/png" }

[denied]
# Stated explicitly so a reviewer sees intent, not merely absence.
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]
