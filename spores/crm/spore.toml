schema = 1

[spore]
id = "dev.fungos.crm"
name = "crm"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "CRM Spore over namespaced records, with per-brand CRM namespaces and a pipeline board"
description = "A CRM whose data is records: per-brand namespaces, a pipeline board, and no network path of its own."

[docs]
usage = ["crm", "crm --version"]
man = "docs/man.md"

[catalog]
categories = ["productivity", "communication"]
keywords = ["crm", "pipeline", "leads", "records"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { records = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/editor.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "native", "web"]

[grants]
"soil:records" = "read/write the granted CRM, calls and messages namespaces; read contacts"

[denied]
"soil:http" = ["the CRM Spore has no network authority"]
"wasi:filesystem" = ["the host maps namespaces to books"]
