# Installed Spore chrome: the bar at the top of a surface.
#
schema = 1

[spore]
id = "dev.fungos.chrome"
name = "chrome"
version = "0.1.0"
license = "MIT"
summary = "The system bar: workspaces, focus, and the ambient facts"
homepage = "https://github.com/fungOS-linux/spores"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { spore = "0.1.0", canvas = "1.0.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/bar.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "native"]

[grants]
"soil:canvas" = "present the bar"
"soil:device" = "read battery state"
"soil:time" = "read elapsed time; wall clock is the gap noted in wit/world.wit"
# Pending `soil:shell`: workspaces and focus. Until that package exists the bar
# renders them from a host view model, which is a stub, not a contract.

[denied]
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem"]

[presentation]
badge = "▓"
color = "#7aa2ff"
