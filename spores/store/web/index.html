<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spore Store</title>
<meta name="description" content="Browse, review and install Spore packages">
<style>
:root { color-scheme: dark; --bg:#0b0d12; --panel:#141821; --edge:#222735; --ink:#e9ecf3; --dim:#98a1b3; --accent:#8b9dff; --good:#7ad0a3; --warn:#f2c14e; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif,-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
header.bar { position:sticky; top:0; z-index:10; display:flex; gap:18px; align-items:center; padding:12px clamp(16px,3vw,40px); background:rgba(11,13,18,.82); backdrop-filter:blur(14px); border-bottom:1px solid var(--edge); }
.account { display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; border-radius:999px; border:1px solid var(--edge); background:var(--panel); color:var(--ink); font:inherit; cursor:pointer; }
.account:hover { border-color:#3a4260; }
.avatar { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; color:#0b0d12; background:linear-gradient(140deg,#8b9dff,#5ee0c0); }
.account .who { display:flex; flex-direction:column; align-items:flex-start; line-height:1.2; }
.account .who b { font-size:12.5px; font-weight:600; }
.account .who span { font-size:10.5px; color:var(--dim); }
.account-wrap { position:relative; }
.account-menu { position:absolute; top:calc(100% + 8px); left:0; min-width:250px; padding:8px; border-radius:12px; border:1px solid var(--edge); background:#12161f; box-shadow:0 18px 40px rgba(0,0,0,.45); display:none; }
.account-menu[open] { display:block; }
.account-menu .row { padding:8px 10px; border-radius:8px; }
.account-menu .row b { display:block; font-size:12.5px; }
.account-menu .row span { color:var(--dim); font-size:11.5px; }
.account-menu .row + .row { border-top:1px solid var(--edge); border-radius:0; }
header.bar h1 { font-size:16px; margin:0; letter-spacing:-.01em; white-space:nowrap; }
header.bar h1 span { color:var(--accent); }
.search { flex:1; max-width:520px; position:relative; }
.search input { width:100%; padding:9px 13px 9px 34px; border-radius:10px; border:1px solid var(--edge); background:var(--panel); color:var(--ink); font:inherit; }
.search input:focus { outline:none; border-color:var(--accent); }
.search svg { position:absolute; left:11px; top:10px; opacity:.5; }
.status { margin-left:auto; color:var(--dim); font-size:12px; white-space:nowrap; }
main { padding:22px clamp(16px,3vw,40px) 56px; max-width:none; margin:0 auto; }
.hero { position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--edge); background:linear-gradient(140deg,#1a2030,#0f1420 60%); min-height:clamp(300px,42vh,520px); display:flex; align-items:flex-end; }
.hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.55; }
.hero .shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(9,11,16,.1) 30%,rgba(9,11,16,.92)); }
.hero .copy { position:relative; padding:28px; max-width:640px; }
.hero .eyebrow { color:var(--accent); font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
.hero h2 { margin:6px 0 8px; font-size:32px; letter-spacing:-.02em; }
.hero p { margin:0 0 14px; color:#cfd5e2; }
.dots { position:absolute; right:20px; bottom:18px; display:flex; gap:7px; }
.dots button { width:8px; height:8px; border-radius:50%; border:0; background:#4a5266; padding:0; cursor:pointer; }
.dots button[aria-current="true"] { background:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 18px; }
.chip { padding:5px 11px; border-radius:999px; border:1px solid var(--edge); color:var(--dim); font-size:12px; cursor:pointer; background:transparent; }
.chip[aria-pressed="true"] { color:#0b0d12; background:var(--accent); border-color:var(--accent); font-weight:600; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
.card { display:flex; flex-direction:column; padding:18px; border:1px solid var(--edge); border-radius:16px; background:var(--panel); transition:transform .12s ease,border-color .12s ease; }
.card:hover { transform:translateY(-2px); border-color:#3a4260; }
.card .top { display:flex; gap:12px; align-items:center; }
.icon { width:56px; height:56px; border-radius:14px; object-fit:cover; background:#1d2230; display:grid; place-items:center; font-size:24px; font-weight:700; color:var(--accent); flex:0 0 56px; }
.card .name { font-weight:650; font-size:16px; }
.card .by { color:var(--dim); font-size:12px; }
.card .summary { color:#c6ccdb; font-size:13.5px; margin:12px 0 14px; min-height:38px; }
.meta { display:flex; align-items:center; gap:8px; margin-top:auto; color:var(--dim); font-size:12px; }
.state { padding:3px 8px; border-radius:999px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
.state.installed { background:#17281f; color:var(--good); } .state.update { background:#2a2618; color:var(--warn); } .state.available { background:#1a2130; color:var(--accent); }
.stars { color:#f2c14e; letter-spacing:1px; }
.detail { display:grid; gap:26px; }
.detail .head { display:flex; gap:18px; align-items:center; }
.detail .head .icon { width:84px; height:84px; flex:0 0 84px; font-size:34px; border-radius:20px; }
.detail h2 { margin:0; font-size:30px; letter-spacing:-.02em; }
.detail .lede { color:#c6ccdb; font-size:16px; }
.shots { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
.shots figure { margin:0; }
.shots img { width:100%; border-radius:14px; border:1px solid var(--edge); display:block; }
.shots figcaption { color:var(--dim); font-size:12px; margin-top:6px; }
.panel { border:1px solid var(--edge); border-radius:16px; padding:22px; background:var(--panel); }
.panel h3 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); }
ul.grants { margin:0; padding-left:18px; color:#c6ccdb; }
ul.grants code { color:var(--accent); }
ul.reviews { list-style:none; margin:0; padding:0; display:grid; gap:14px; }
ul.reviews li { border-top:1px solid var(--edge); padding-top:14px; }
ul.reviews li:first-child { border-top:0; padding-top:0; }
ul.reviews .who { color:var(--dim); font-size:12px; margin-left:8px; }
ul.reviews p { margin:6px 0 0; color:#c6ccdb; }
.actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
button.primary, button.ghost { padding:10px 16px; border-radius:10px; font:inherit; cursor:pointer; }
button.primary { background:var(--accent); color:#0b0d12; border:0; font-weight:650; }
button.primary[disabled] { background:#2a3145; color:var(--dim); cursor:default; }
button.ghost { background:transparent; color:var(--ink); border:1px solid var(--edge); }
.empty { color:var(--dim); padding:40px 0; text-align:center; }
footer { color:#6f7787; font-size:12px; padding:26px 28px; border-top:1px solid var(--edge); text-align:center; }
@media (max-width:640px){ main{padding:16px 16px 40px} header.bar{padding:10px 14px; gap:10px} .hero h2{font-size:24px} .account .who{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<script>
// The store is a Spore: this page is its view, and the service is somebody
// else's. `STORE_API` is empty when the page is served by that service (or by
// the gateway in front of it); a host web view sets it to the store's origin.
const API = window.STORE_API || '';
const app = document.getElementById('app');
const state = { rows: [], source: null, query: '', category: null, error: null, loading: true };
// Who this session is, as far as the page can tell. `/api/whoami` is the store
// saying what the gateway authenticated; a store with no gateway answers
// nothing and the page says so instead of inventing a user.
const account = { principal: null, store: null };

const initial = () => (account.principal || 'local').replace(/^[^:]*:/, '').replace(/[^a-z0-9]/gi, '').slice(0, 1).toUpperCase() || 'L';
const accountName = () => account.principal ? account.principal.replace(/^[^:]*:/, '') : 'Local session';
const accountSub = () => account.principal ? 'signed in' : 'this machine';

function headerHtml(options = {}) {
  const withSearch = options.withSearch !== false;
  const status = options.back
    ? '<a href="#/">← All Spores</a>'
    : state.source ? `${esc(state.source.name)}${state.source.verified ? ' · verified' : ' · unsigned'}` : '';
  return `<header class="bar"><div class="account-wrap"><button class="account" id="account" aria-haspopup="true" aria-expanded="false"><span class="avatar">${esc(initial())}</span><span class="who"><b>${esc(accountName())}</b><span>${esc(accountSub())}</span></span></button><div class="account-menu" id="account-menu" role="menu"><div class="row"><b>${esc(account.principal || 'Local session')}</b><span>${account.principal ? 'Authenticated by the gateway' : 'No gateway identity on this page yet'}</span></div><div class="row"><b>${esc(account.store || state.source?.name || 'fungos')}</b><span>Active store source</span></div><div class="row"><b>Switch account</b><span>Use the gateway’s OIDC or mTLS session — the page never holds a credential</span></div></div></div><h1>Spore <span>Store</span></h1>${withSearch ? '<label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search the store" value="' + esc(state.query) + '" autocomplete="off"></label>' : ''}<span class="status">${status}</span></header>`;
}

function wireAccount() {
  const button = document.getElementById('account');
  const menu = document.getElementById('account-menu');
  if (!button || !menu) return;
  button.addEventListener('click', (event) => {
    event.stopPropagation();
    const open = menu.hasAttribute('open');
    menu.toggleAttribute('open', !open);
    button.setAttribute('aria-expanded', String(!open));
  });
  document.addEventListener('click', () => {
    menu.removeAttribute('open');
    button.setAttribute('aria-expanded', 'false');
  });
}

async function whoami() {
  try {
    const me = await get('/api/whoami');
    account.principal = me.principal || null;
    account.store = me.store || null;
  } catch {
    account.principal = null;
  }
}

const media = (ref) => ref ? `${API}/media/${String(ref).replace('ipfs://', '')}` : null;
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const doc = (row) => row.document || {};

async function get(path) {
  const response = await fetch(API + path, { headers: { accept: 'application/json' } });
  if (!response.ok) throw new Error(`${path}: ${response.status}`);
  return response.json();
}

function rating(row) {
  const value = row.ratings && row.ratings.current;
  if (!value || !value.count) return '';
  const stars = '★★★★★'.slice(0, Math.max(1, Math.round(value.weighted))) + '☆☆☆☆☆'.slice(0, 5 - Math.max(1, Math.round(value.weighted)));
  return `<span class="stars" title="${value.weighted.toFixed(1)} of this build, ${row.ratings.all.count} across all versions">${stars}</span> ${value.weighted.toFixed(1)}`;
}

function hero() {
  const featured = state.rows.filter((row) => (doc(row).screenshots || []).length);
  if (!featured.length) {
    const first = state.rows[0];
    if (!first) return '';
    return `<section class="hero"><div class="shade"></div><div class="copy"><div class="eyebrow">${esc(state.source?.name || 'store')}</div><h2>${esc(doc(first).name || first.id)}</h2><p>${esc(doc(first).summary || '')}</p><a class="" href="#/s/${esc(first.id)}"><button class="primary">Open</button></a></div></section>`;
  }
  return `<section class="hero" id="hero">${featured.slice(0, 3).map((row, index) => {
    const shot = (doc(row).screenshots || [])[0];
    return `<img data-slide="${index}" src="${media(shot.cid)}" alt="${esc(shot.caption)}" style="display:${index === 0 ? 'block' : 'none'}">`;
  }).join('')}<div class="shade"></div><div class="copy" id="hero-copy"></div><div class="dots">${featured.slice(0, 3).map((_, index) => `<button data-dot="${index}" aria-current="${index === 0}" aria-label="Screenshot ${index + 1}"></button>`).join('')}</div></section>`;
}

function paintHero(index) {
  const featured = state.rows.filter((row) => (doc(row).screenshots || []).length).slice(0, 3);
  const row = featured[index];
  if (!row) return;
  document.querySelectorAll('[data-slide]').forEach((img) => { img.style.display = Number(img.dataset.slide) === index ? 'block' : 'none'; });
  document.querySelectorAll('[data-dot]').forEach((dot) => dot.setAttribute('aria-current', String(Number(dot.dataset.dot) === index)));
  document.getElementById('hero-copy').innerHTML = `<div class="eyebrow">${esc(state.source?.name || 'store')} · featured</div><h2>${esc(doc(row).name || row.id)}</h2><p>${esc(doc(row).summary || '')}</p><div class="actions"><a href="#/s/${esc(row.id)}"><button class="primary">Open</button></a><span class="meta">${rating(row)}</span></div>`;
}

function categories() {
  const seen = new Set();
  state.rows.forEach((row) => (doc(row).categories || []).forEach((value) => seen.add(value)));
  return [...seen].sort();
}

function card(row) {
  const item = doc(row);
  const icon = item.icon ? `<img class="icon" src="${media(item.icon)}" alt="">` : `<div class="icon">${esc(item.badge || (item.name || row.id)[0].toUpperCase())}</div>`;
  return `<a class="card" href="#/s/${esc(row.id)}"><div class="top">${icon}<div><div class="name">${esc(item.name || row.id)}</div><div class="by">${esc(row.publisher || 'unknown publisher')}</div></div></div><div class="summary">${esc(item.summary || '')}</div><div class="meta"><span class="state ${esc(row.state || 'available')}">${row.state === 'update' ? 'update' : row.state === 'installed' ? 'installed' : 'get'}</span>${rating(row)}<span style="margin-left:auto">${esc((item.categories || [])[0] || '')}</span></div></a>`;
}

function grid() {
  if (state.loading) return `<div class="empty">Reading the catalog…</div>`;
  if (state.error) return `<div class="empty">${esc(state.error)}<br><small>Set <code>STORE_API</code> to the store's origin if this page is not served by it.</small></div>`;
  if (!state.rows.length) return `<div class="empty">Nothing matches${state.query ? ` “${esc(state.query)}”` : ''}.</div>`;
  return `<div class="grid">${state.rows.map(card).join('')}</div>`;
}

async function render() {
  const route = currentRoute();
  if (route.startsWith('/s/')) return renderDetail(route.slice(3));
  app.innerHTML = `${headerHtml()}<main>${hero()}<div class="chips">${[''].concat(categories()).map((value) => `<button class="chip" data-cat="${esc(value)}" aria-pressed="${String((state.category || '') === value)}">${esc(value || 'All')}</button>`).join('')}</div>${grid()}</main><footer>Reads a signed catalog over soil:http · installs go through the host's consent</footer>`;
  if (!state.loading && !state.error) paintHero(0);
  wire();
}

function wire() {
  wireAccount();
  const input = document.getElementById('q');
  let timer;
  input?.addEventListener('input', () => {
    clearTimeout(timer);
    state.query = input.value.trim();
    timer = setTimeout(load, 140);
  });
  document.querySelectorAll('[data-cat]').forEach((button) => button.addEventListener('click', () => {
    state.category = button.dataset.cat || null;
    load();
  }));
  document.querySelectorAll('[data-dot]').forEach((dot) => dot.addEventListener('click', () => { heroIndex = Number(dot.dataset.dot); paintHero(heroIndex); }));
}

let heroIndex = 0;
setInterval(() => {
  if (!document.getElementById('hero')) return;
  const count = document.querySelectorAll('[data-slide]').length;
  if (count < 2) return;
  heroIndex = (heroIndex + 1) % count;
  paintHero(heroIndex);
}, 6000);

async function load() {
  state.loading = true;
  state.error = null;
  render();
  try {
    const query = new URLSearchParams();
    if (state.query) query.set('q', state.query);
    if (state.category) query.set('category', state.category);
    const path = query.toString() ? `/api/search?${query}` : '/api/catalog';
    const body = await get(path);
    state.rows = body.entries || [];
    state.source = body.source || state.source;
  } catch (error) {
    state.error = `Could not reach the store (${error.message}).`;
  }
  state.loading = false;
  render();
}

async function renderDetail(id) {
  app.innerHTML = `${headerHtml({ back: true })}<main><div class="empty">Opening ${esc(id)}…</div></main>`;
  try {
    const body = await get('/api/catalog');
    state.rows = body.entries || [];
    state.source = body.source || state.source;
    const row = state.rows.find((entry) => entry.id === id);
    if (!row) { app.innerHTML = `${headerHtml({ back: true })}<main><div class="empty">No such Spore in this catalog.</div></main>`; return; }
    const item = doc(row);
    const reviews = row.digest ? await get(`/api/reviews?digest=${row.digest}`).catch(() => null) : null;
    const shots = (item.screenshots || []).map((shot) => `<figure><img src="${media(shot.cid)}" alt="${esc(shot.caption)}"><figcaption>${esc(shot.caption)}</figcaption></figure>`).join('');
    const grants = (row.grants || []).map((grant) => `<li><code>${esc(grant)}</code></li>`).join('') || '<li>No host capabilities requested.</li>';
    const bodies = reviews ? reviews.reviews.map((review) => `<li><span class="stars">${'★'.repeat(review.rating)}</span><strong>${esc(review.principal)}</strong><p>${esc(review.body)}</p></li>`).join('') : '';
    const summary = reviews && reviews.ratings.current.count
      ? `<p class="meta">${rating(row)} of this build · ${reviews.ratings.all.weighted.toFixed(1)} across all versions (${reviews.ratings.all.count})</p>`
      : `<p class="meta">No reviews of this build yet.</p>`;
    app.innerHTML = `${headerHtml({ back: true })}<main><div class="detail"><div class="head">${item.icon ? `<img class="icon" src="${media(item.icon)}" alt="">` : `<div class="icon">${esc(item.badge || (item.name || id)[0].toUpperCase())}</div>`}<div><h2>${esc(item.name || id)}</h2><div class="meta">${esc(row.publisher || 'unknown publisher')} · ${esc(item.license || '')} · ${esc(row.version)}</div></div></div><p class="lede">${esc(item.description || item.summary || '')}</p><div class="actions"><button class="primary" id="install" ${window.soil?.install ? '' : 'disabled'}>${row.state === 'update' ? 'Update' : 'Install'}</button><button class="ghost" id="share">Copy link</button><span class="meta">${rating(row)}</span></div>${shots ? `<div class="shots">${shots}</div>` : ''}<div class="panel"><h3>What it can reach</h3><ul class="grants">${grants}</ul></div><div class="panel"><h3>Reviews</h3>${summary}<ul class="reviews">${bodies}</ul></div><footer style="border:0;padding:0">${esc(row.id)} · ${esc(row.digest)}</footer></div></main>`;
    document.getElementById('share')?.addEventListener('click', () => {
      const link = `${location.origin}/s/${id}`;
      navigator.clipboard?.writeText(link);
      location.hash = `#/s/${id}`;
    });
    document.getElementById('install')?.addEventListener('click', () => {
      if (window.soil?.install) window.soil.install({ id: row.id, digest: row.digest, package: row.package });
    });
  } catch (error) {
    app.innerHTML = `${headerHtml({ back: true })}<main><div class="empty">${esc(error.message)}</div></main>`;
  }
}

// A shareable link is `/s/<id>`; the in-page route is `#/s/<id>`. One reader
// for both, so a copied URL opens the same listing the click does.
function currentRoute() {
  if (location.hash) return location.hash.replace(/^#/, '') || '/';
  const path = location.pathname.replace(/\/+$/, '');
  return path.startsWith('/s/') ? path : '/';
}

addEventListener('hashchange', render);
whoami().then(load);
</script>
</body>
</html>
