# The Spore Store front end. See fungOS-linux/soil docs/spore-store.md for the
# service, the listing rules and the install pipeline.
#
# This slice is two views of one store. A GPUI component (`module.wasm`) draws
# the shopfront, renders through `wasi:webgpu` and presents the texture with
# `soil:canvas-gpu`; a browser draws `web/index.html`; and the Lua composition
# stays as the fallback for a host that runs components but has no GPU surface.
# All three read the same catalog from the store service.
#
# The module reads that catalog with `soil:http`, which is why the grant is
# declared rather than denied: the guest calls it. Installing stays the host's
# authority and stays denied — the window names an intent, the host decides.

schema = 1

[spore]
id = "dev.fungos.store"
name = "store"
version = "0.2.0"
license = "MIT"
summary = "Browse, review and install Spore packages"
description = "The storefront: categories, screenshots, ratings and a classified update queue, with install and update as named intents the host executes. The shell draws it as a GPUI component through wasi:webgpu; a browser draws the same store from web/index.html, with shareable links to each listing."
homepage = "https://github.com/fungOS-linux/spores"

[docs]
usage = ["store", "store --updates", "store --version"]
man = "docs/man.md"

[catalog]
categories = ["system", "developer-tools"]
keywords = ["store", "install", "updates", "packages", "reviews"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { canvas = "1.0.0" }


[ui]
entry = "ui/store.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
canvas_module = "spore-dev-store"
surfaces = ["canvas", "web", "native"]

# The shell draws the composition: a canvas surface whose artifact is this
# package's `[ui] entry`.
[[surfaces]]
name = "canvas"
kind = "canvas"

# The same store as a page: what `store.myc` can serve to a browser and what a
# host web view presents. `web/index.html` is the conventional artifact, so the
# surface names its kind and nothing else.
[[surfaces]]
name = "store"
kind = "web"

# The host allowlists an exact id, role, digest and publisher before treating a
# surface as the store. The role is what makes the storefront the trusted face;
# the install authority is the host capability, never the window.
[system]
role = "store"

[grants]
"soil:canvas" = "present the storefront"

[denied]
"soil:http" = ["the signed index is fetched and verified by the host"]
"soil:spore.catalog" = ["the view names an intent; the host reads the catalog"]
"soil:spore.install" = ["installing is the host's authority, not the window's"]

[presentation]
badge = "S"
color = "#f2c14e"
