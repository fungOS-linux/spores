# The Spore Store front end. See fungOS-linux/soil docs/spore-store.md for the
# service, the listing rules and the install pipeline.
#
# This slice is the composition: it draws a snapshot and emits intents. The
# module that reads the signed index and calls `soil:spore.install` is the next
# package revision, which is why the two grants it will need are denied below
# rather than declared: a grant this package cannot call is a claim, not a
# capability.

schema = 1

[spore]
id = "dev.fungos.store"
name = "store"
version = "0.1.0"
license = "MIT"
summary = "Browse, review and install Spore packages"
description = "The storefront: categories, screenshots, ratings and a classified update queue, with install and update as named intents the host executes."
homepage = "https://github.com/fungOS-linux/spores"

[docs]
usage = ["store", "store --updates", "store --version"]
man = "docs/man.md"

[catalog]
categories = ["system", "developer-tools"]
keywords = ["store", "install", "updates", "packages", "reviews"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { canvas = "1.0.0" }

[ui]
entry = "ui/store.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
canvas_module = "spore-dev-store"
surfaces = ["canvas", "web", "native"]

# The host allowlists an exact id, role, digest and publisher before treating a
# surface as the store. The role is what makes the storefront the trusted face;
# the install authority is the host capability, never the window.
[system]
role = "store"

[grants]
"soil:canvas" = "present the storefront"

[denied]
"soil:spore.catalog" = ["the view names an intent; the host reads the catalog"]
"soil:spore.install" = ["installing is the host's authority, not the window's"]
"soil:http" = ["the signed index is fetched and verified by the host"]

[presentation]
badge = "S"
color = "#f2c14e"
