[package]
name = "store-view-spore"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
# Local wasip2 branch: released gpui has no from_offscreen / headless wasm path.
gpui = { path = "/Users/ajmwagar/src/fungOS/gpui-fast/crates/gpui", default-features = false, features = ["headless"] }
gpui_wgpu = { path = "/Users/ajmwagar/src/fungOS/gpui-fast/crates/gpui_wgpu", default-features = false, features = ["headless"] }
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
wgpu-wasi-webgpu = { git = "https://github.com/fungOS-linux/wgpu-wasi-webgpu", rev = "bec921356c366450408d5faee2d206b6a1b8061b" }
wit-bindgen = "0.57"

[workspace]
