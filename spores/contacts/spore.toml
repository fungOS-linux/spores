schema = 1

[spore]
id = "dev.fungos.contacts"
name = "contacts"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "Personal contacts with explicit CRM projections"
description = "Personal contacts first, with CRM entries as explicit projections. A contact is yours; a projection into a brand's CRM is a named act, not a side effect."

[docs]
usage = ["contacts", "contacts --version"]
man = "docs/man.md"

[catalog]
categories = ["communication", "productivity"]
keywords = ["contacts", "people", "crm"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { records = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/editor.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "native", "web"]

[grants]
"soil:records" = "read/write personal contacts and write explicit CRM projections"

"wasi:cli" = "Rust std diagnostics; no args, environment, or process launch"
"wasi:clocks" = "monotonic timing for the guest's scheduler"
"wasi:io" = "component-model async transport"
[denied]
"soil:http" = ["contact data has no network authority"]
"wasi:filesystem" = ["the host maps namespaces to books"]

[presentation]
badge = "Ct"
color = "#f0a35e"
mark = "assets/icon.svg"
