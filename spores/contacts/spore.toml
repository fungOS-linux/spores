# Contacts Spore over soil:records. See docs/soil-records.md.
schema = 1

[spore]
id = "dev.fungos.contacts"
name = "contacts"
version = "0.1.0"
license = "MIT"
summary = "Searchable contacts from the local records book"
homepage = "https://github.com/fungOS-linux/spores"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { records = "0.1.0", canvas = "1.0.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/contacts.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
# The composed Lua UI Canvas launches for this app. Composition writes it into
# the runtime modules directory; the launcher opens it as a window.
canvas_module = "spore-dev-contacts"
surfaces = ["web", "native", "canvas"]

[grants]
"soil:records.read" = "read the contact collection"
"soil:canvas" = "present the contact directory"

[denied]
# Read-only Spore. Write/sync grants are separate.
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]

[presentation]
# A launcher row needs to be recognisable without reading it. A monogram is a
# character, not an asset: it cannot go missing on someone else's machine, and it
# reads at the size a launcher actually draws.
badge = "C"
color = "#7bd88f"
