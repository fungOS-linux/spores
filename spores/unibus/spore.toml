# Initial soil:unibus Spore. See docs/records.md and docs/ai-inbox-spec.md.
schema = 1

[spore]
id = "dev.fungos.unibus"
name = "unibus"
version = "0.1.0"
license = "MIT"
summary = "Mail/chat metadata cached as soil:records, fed by soil:unibus"
homepage = "https://github.com/fungOS-linux/spores"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { canvas = "1.0.0", records = "0.1.0", unibus = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/inbox.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
# The composed Lua UI Canvas launches for this app. Composition writes it into
# the runtime modules directory; the launcher opens it as a window.
canvas_module = "spore-dev-inbox"
surfaces = ["web", "native", "canvas"]

[grants]
"soil:unibus.observe" = "poll email.* and chat.* metadata frames"
"soil:records.read" = "read the local metadata cache"
"soil:records.write" = "store/update metadata records"
"soil:records.sync" = "export/apply record changes across devices"
"soil:canvas" = "present the inbox surface"

[denied]
# Sending is a separate future grant; this Spore is read-only.
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]

[[actions]]
id = "mail.read"
title = "Mark read"
input = "mail/thread-ref@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[[actions]]
id = "mail.unread"
title = "Mark unread"
input = "mail/thread-ref@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[[actions]]
id = "mail.archive"
title = "Archive"
input = "mail/thread-ref@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[[actions]]
id = "mail.tag"
title = "Tag thread"
input = "mail/tag@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[presentation]
# A launcher row needs to be recognisable without reading it. A monogram is a
# character, not an asset: it cannot go missing on someone else's machine, and it
# reads at the size a launcher actually draws.
badge = "I"
color = "#6ea8fe"
