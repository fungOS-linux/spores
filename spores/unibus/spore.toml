# The read-only inbox Spore. See docs/records.md and docs/ai-inbox-spec.md.
#
# Named for what it is, not for the bus it reads. The `soil:unibus.*` grants
# below make this a *client* of Unibus; a Spore called `unibus` would read as
# owning the bus, and the next app that also reads mail would have nowhere
# honest to live. Composing and sending are a separate Spore with a separate
# grant set (`dev.fungos.mail`), so "is this allowed to send?" is answered by
# the manifest and never by auditing the view.
schema = 1

[spore]
id = "dev.fungos.inbox"
name = "inbox"
version = "0.1.0"
license = "MIT"
summary = "Read-only inbox over soil:unibus mail/chat metadata, cached as soil:records"
description = "One inbox over mail and chat metadata. It observes, caches and labels; it never sends, and every action it offers is a records write with a name."
homepage = "https://github.com/fungOS-linux/spores"

[docs]
usage = ["inbox", "inbox --version"]
man = "docs/man.md"

[catalog]
categories = ["communication", "productivity"]
keywords = ["inbox", "mail", "chat", "unibus"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { canvas = "1.0.0", records = "0.1.0", unibus = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/inbox.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
# The composed Lua UI Canvas launches for this app. Composition writes it into
# the runtime modules directory; the launcher opens it as a window.
canvas_module = "spore-dev-inbox"
surfaces = ["web", "native", "canvas"]

[grants]
"soil:unibus" = "poll email.* and chat.* metadata frames"
"soil:records" = "read the local metadata cache; store/update metadata records; export/apply record changes across devices"
"soil:canvas" = "present the inbox surface"

"wasi:cli" = "Rust std diagnostics; no args, environment, or process launch"
"wasi:clocks" = "monotonic timing for the guest's scheduler"
"wasi:io" = "component-model async transport"
[denied]
# Sending is a separate future grant; this Spore is read-only.
transport = ["socket", "quic", "iroh"]
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]

[[actions]]
id = "mail.read"
title = "Mark read"
input = "mail/thread-ref@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[[actions]]
id = "mail.unread"
title = "Mark unread"
input = "mail/thread-ref@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[[actions]]
id = "mail.archive"
title = "Archive"
input = "mail/thread-ref@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[[actions]]
id = "mail.tag"
title = "Tag thread"
input = "mail/tag@1"
requires = ["soil:records.write"]
callers = ["human", "agent"]
expose = ["ui", "socket", "mcp", "dcp"]
idempotent = true

[presentation]
# A launcher row needs to be recognisable without reading it. A monogram is a
# character, not an asset: it cannot go missing on someone else's machine, and it
# reads at the size a launcher actually draws.
badge = "I"
color = "#6ea8fe"
mark = "assets/icon.svg"
