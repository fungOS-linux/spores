[package]
name = "spore-unibus"
description = "Unibus mail/chat metadata cache as records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.41"

# wit-bindgen emits unsafe shims and export_name; isolate that to this Spore.
[lints.rust]
unsafe_code = "allow"
