schema = 1

[spore]
id = "dev.fungos.media-probe"
name = "media-probe"
version = "0.1.0"
license = "MIT"
summary = "Fixture Spore for soil:media playback, encoded chunks, and image readback"
description = "A fixture, not an app: it exercises media playback, encoded chunks and image readback so the host ABI can be tested without a real media application."

[docs]
usage = ["media-probe"]
man = "docs/man.md"

[catalog]
categories = ["developer-tools", "media"]
keywords = ["fixture", "media", "abi", "test"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { media = "0.1.0", "media-encoded" = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/probe.lua"
jit = true
hot_reload = false

[launch]
default = "native"
surfaces = ["native", "canvas"]

[grants]
"soil:media" = "open host-reviewed fixture playback and image sources"
"soil:media-encoded" = "read fixture encoded chunks for the ABI test"
