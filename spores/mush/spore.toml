schema = 1

[spore]
id = "dev.fungos.mush"
name = "mush"
version = "0.1.0"
license = "MIT"
summary = "Sandboxed VFS shell with a real environment and startup file"
description = "A shell over one workspace: real `PWD`, environment and startup file, with installed wasm commands instead of host binaries."

[docs]
usage = ["mush [--root DIR]", "mush --script FILE", "man NAME"]
man = "docs/man.md"

[catalog]
categories = ["developer-tools", "system"]
keywords = ["shell", "terminal", "wasm", "vfs"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { vfs = "1.0.0", index = "1.1.0", vfs-mut = "0.1.0", command = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/shell.lua"
jit = true
hot_reload = true

[launch]
default = "native"
surfaces = ["native", "canvas", "web"]

[grants]
"soil:vfs" = "read workspace files and directories"
"soil:index" = "search the workspace and browse directories"
"soil:vfs-mut" = "write, rename, unlink, mkdir, and rmdir in the workspace"
"soil:command" = "run installed wasm commands with explicit args and no host PATH"
"soil:net" = "resolve names and probe TCP ports through the host"
"soil:http" = "bounded HTTP through the host allowlist, with no credentials by default"
"wasi:cli" = "Rust std diagnostics; no args, environment, or process launch"
"wasi:clocks" = "monotonic timing for the guest's scheduler"
"wasi:io" = "component-model async transport"
