<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Worklog</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191919;color:#e9e9e7;font:13px ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif}
    canvas{display:block;width:100%;height:100%}
    /* The view draws the field and its text; the input is the caret and the keys.
       Text is transparent so the glyphs on screen are the document's, never two
       copies of the same word. */
    #q{position:fixed;border:0;outline:0;background:transparent;color:transparent;
       caret-color:#e9e9e7;font:inherit;padding:0;margin:0;z-index:2}
    #status{position:fixed;right:14px;bottom:10px;color:#6a6a6a;font-size:11px;pointer-events:none;z-index:1}
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<input id="q" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="">
<div id="status">loading</div>
<script>
// The page draws the worklog's scene document; it does not know what a worklog
// row is. Nodes carry `transform.translation` / `transform.scale` in the -4..4
// space, `ink` as a role, and — because this document came from a preview — the
// resolved `rgb` and text `px` as well. A host resolves those two itself; the
// page can only draw them.
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
// Every frame is built off-screen and blitted in one call. The canvas on screen is
// never cleared, so there is no moment when it can show an empty or half-built
// scene — a repaint replaces every pixel at once or not at all.
const frame = document.createElement('canvas');
const paint = frame.getContext('2d');
const status = document.getElementById('status');
const input = document.getElementById('q');
let dpr = 1, size = { w: 0, h: 0 };
// The last body we painted, and the tag that names it. A poll that comes back
// unchanged must not touch the canvas at all.
let tag = null, lastBody = null, inFlight = false, current = null;
// Host state the view reads. The page owns the text, the pointer and the offset;
// what a query matches and how far the log goes are the view's answers.
let query = '', offset = 0, hover = '', meta = { row_height: 0, first: 0, shown: 0, total: 0 };

// What a role means when the palette did not resolve it. A missing colour should
// look like a missing colour, not like invisible text.
const INKS = {
  background: '#0d0f14', surface: '#1e2430', text: '#e6ebf5', muted: '#8b96ab',
  primary: '#f2f5fb', success: '#a6da95', warning: '#eed49f', info: '#7dc4e4',
  danger: '#ed8796',
};

function fillOf(node) {
  const alpha = node.opacity ?? 1;
  if (node.rgb) {
    const [r, g, b] = node.rgb;
    return `rgba(${r},${g},${b},${alpha})`;
  }
  const hex = INKS[node.ink] || INKS.text;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

// Resizing a canvas clears it, so it happens only when the window actually
// changed size — never on a poll.
function fit() {
  const next = { w: innerWidth, h: innerHeight };
  if (next.w === size.w && next.h === size.h && canvas.width > 0) return false;
  dpr = window.devicePixelRatio || 1;
  size = next;
  canvas.width = Math.floor(size.w * dpr);
  canvas.height = Math.floor(size.h * dpr);
  frame.width = canvas.width;
  frame.height = canvas.height;
  return true;
}

function draw(scene, w, h) {
  paint.setTransform(dpr, 0, 0, dpr, 0, 0);
  paint.clearRect(0, 0, w, h);
  const xOf = (u) => (u + 4) / 8 * w;
  const yOf = (u) => (4 - u) / 8 * h;

  // Canvas sorts scene nodes by z and breaks ties by insertion order, so a stable
  // sort by z here paints the same picture. `radius` is a length in surface
  // pixels, like every other length the view hands over.
  const nodes = [...(scene.nodes || [])].sort(
    (a, b) => ((a.transform?.translation?.[2] ?? 0) - (b.transform?.translation?.[2] ?? 0)));

  for (const node of nodes) {
    const t = node.transform || {};
    const [x, y] = t.translation || [0, 0, 0];
    const [sx, sy] = t.scale || [1, 1, 1];
    paint.fillStyle = fillOf(node);
    if (node.type === 'rect') {
      const px = xOf(x), py = yOf(y);
      const rw = sx / 8 * w, rh = sy / 8 * h;
      const radius = Math.min(node.radius || 0, rw / 2, rh / 2);
      paint.beginPath();
      if (paint.roundRect) paint.roundRect(px, py, rw, rh, radius);
      else paint.rect(px, py, rw, rh);
      paint.fill();
    } else if (node.type === 'text') {
      paint.font = `${node.px}px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif`;
      paint.textBaseline = 'top';
      paint.fillText(node.text || '', xOf(x), yOf(y));
    }
  }

  // One blit, one composite. No clear on the visible canvas: the scene paints its
  // own background, so the blit covers every pixel it is about to replace.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(frame, 0, 0);
}

// Normalized scene units -> surface pixels, the inverse of `nx`/`ny`. Hit targets
// arrive in the same space the nodes do.
function rectOf(hit) {
  return {
    x: (hit.x + 4) / 8 * size.w,
    y: (4 - hit.y) / 8 * size.h,
    w: hit.width / 8 * size.w,
    h: hit.height / 8 * size.h,
  };
}

// The view draws the search field; the input sits on top of it, invisible except
// for the caret, so the text on screen is the document's and never two copies of
// the same word. It is placed from the text node, not the box, so the caret and
// the glyphs agree about where the first character is.
function place() {
  if (!current) return;
  const field = (current.hits || []).find((entry) => entry.id === 'worklog-search');
  const text = (current.nodes || []).find((entry) => entry.id === 'worklog-search-value');
  if (!field || !text) {
    input.style.display = 'none';
    return;
  }
  const box = rectOf(field);
  const [tx, ty] = text.transform.translation;
  const left = (tx + 4) / 8 * size.w;
  const top = (4 - ty) / 8 * size.h;
  const field_px = Math.max(11, Math.round(text.px || 13));
  input.style.display = 'block';
  input.style.left = `${left - 1}px`;
  input.style.top = `${top}px`;
  input.style.width = `${Math.max(24, box.x + box.w - left - 12)}px`;
  input.style.height = `${Math.round(field_px * 1.35)}px`;
  input.style.font = `${field_px}px ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif`;
}
function hitAt(x, y) {
  if (!current) return '';
  for (const hit of current.hits || []) {
    if (hit.id === 'worklog-search') continue;
    const box = rectOf(hit);
    if (x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h) return hit.id;
  }
  return '';
}

let timer = 0, queued = false;
function schedule(delay = 80) {
  clearTimeout(timer);
  timer = setTimeout(refresh, delay);
}

async function refresh() {
  if (inFlight) {
    // A keystroke that lands mid-request has to be asked again, or the last word
    // typed is the one the page never shows.
    queued = true;
    return;
  }
  inFlight = true;
  fit();
  const w = Math.round(size.w), h = Math.round(size.h);
  try {
    const params = new URLSearchParams({ w, h, q: query, offset, hover });
    const headers = tag ? { 'if-none-match': tag } : {};
    // `no-cache` means "revalidate before reuse", which is what makes the
    // conditional request meaningful; `no-store` makes the browser bypass its
    // cache entirely, and a bypassed cache has nothing to revalidate.
    const response = await fetch(`scene.json?${params}`, { cache: 'no-cache', headers });
    // Nothing to draw and nothing to say: the page stays exactly as it was, down
    // to the status line. Writing to the DOM on every poll repaints over a canvas
    // that did not need it.
    if (response.status === 304) return;
    if (!response.ok) throw new Error(`scene ${response.status}: ${await response.text()}`);
    // The tag is an optimisation the browser is free to ignore. The body is not:
    // if it is the bytes already on screen, there is nothing to draw.
    const body = await response.text();
    tag = response.headers.get('etag') || tag;
    if (body === lastBody) return;
    lastBody = body;
    const scene = JSON.parse(body);
    if (scene.error) throw new Error(scene.error);
    current = scene;
    meta = scene.meta || meta;
    draw(scene, w, h);
    place();
    status.textContent = `${scene.nodes.length} nodes · ${new Date().toLocaleTimeString()}`;
  } catch (error) {
    status.textContent = String(error.message || error);
  } finally {
    inFlight = false;
    if (queued) {
      queued = false;
      schedule(0);
    }
  }
}

addEventListener('resize', () => {
  schedule(120);
  place();
});

// Hover and scroll are host state the view reads back, so the pointer never draws
// anything itself: it names a row, the view lights it, the new frame is blitted.
canvas.addEventListener('mousemove', (event) => {
  const next = hitAt(event.clientX, event.clientY);
  if (next === hover) return;
  hover = next;
  schedule();
});
canvas.addEventListener('mouseleave', () => {
  if (!hover) return;
  hover = '';
  schedule();
});
canvas.addEventListener('wheel', (event) => {
  event.preventDefault();
  const furthest = Math.max(0, (meta.total - meta.shown) * meta.row_height);
  const next = Math.min(furthest, Math.max(0, offset + event.deltaY));
  if (next === offset) return;
  offset = next;
  schedule(40);
}, { passive: false });

input.addEventListener('input', () => {
  query = input.value;
  // A new search starts at the top: staying at row 400 of a list that now has
  // three matches is how a search looks broken.
  offset = 0;
  schedule(140);
});

refresh();
// The scene is regenerated by the host from the tail of the log, so polling is
// what keeps the page equal to the log rather than equal to the moment I looked.
setInterval(refresh, 5000);
</script>
</body>
</html>
