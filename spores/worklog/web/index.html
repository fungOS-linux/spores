<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Worklog</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0f14;color:#e6ebf5;font:13px ui-monospace,monospace}
    canvas{display:block;width:100%;height:100%}
    #status{position:fixed;right:16px;bottom:12px;color:#8b96ab;pointer-events:none}
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="status">loading</div>
<script>
// The page draws the worklog's scene document; it does not know what a worklog
// row is. Colours arrive resolved (`rgb`), sizes arrive in surface pixels, and
// rationale belongs to the view — the same contract `spores/sfx/web` uses.
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
let dpr = 1, size = { w: 0, h: 0 };

function fit() {
  dpr = window.devicePixelRatio || 1;
  size = { w: innerWidth, h: innerHeight };
  canvas.width = Math.floor(size.w * dpr);
  canvas.height = Math.floor(size.h * dpr);
}

// The scene lives in normalized units: x spans -4..4 and y spans 4..-4 with the
// origin at the top-left. `radius` is a length in surface pixels, like every
// other length the view hands over.
function draw(scene, w, h) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const xOf = (u) => (u + 4) / 8 * w;
  const yOf = (u) => (4 - u) / 8 * h;

  for (const p of scene.nodes) {
    const [r, g, b] = p.rgb || [230, 235, 245];
    ctx.fillStyle = `rgba(${r},${g},${b},${p.opacity ?? 1})`;
    if (p.type === 'rect') {
      const x = xOf(p.x), y = yOf(p.y);
      const rw = p.w / 8 * w, rh = p.h / 8 * h;
      const radius = Math.min(p.radius || 0, rw / 2, rh / 2);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, rw, rh, radius);
      else ctx.rect(x, y, rw, rh);
      ctx.fill();
    } else if (p.type === 'text') {
      ctx.font = `${p.px}px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(p.text || '', xOf(p.x), yOf(p.y));
    }
  }
}

async function refresh() {
  fit();
  const w = Math.round(size.w), h = Math.round(size.h);
  try {
    const response = await fetch(`scene.json?w=${w}&h=${h}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`scene ${response.status}: ${await response.text()}`);
    const scene = await response.json();
    if (scene.error) throw new Error(scene.error);
    draw(scene, w, h);
    status.textContent = `${scene.nodes.length} nodes · ${new Date().toLocaleTimeString()}`;
  } catch (error) {
    status.textContent = String(error.message || error);
  }
}

let pending = 0, lastSize = '';
addEventListener('resize', () => {
  const next = `${innerWidth}x${innerHeight}`;
  if (next === lastSize) return;
  lastSize = next;
  clearTimeout(pending);
  pending = setTimeout(refresh, 120);
});

refresh();
// The scene is regenerated by the host from the tail of the log, so polling is
// what keeps the page equal to the log rather than equal to the moment I looked.
setInterval(refresh, 5000);
</script>
</body>
</html>
