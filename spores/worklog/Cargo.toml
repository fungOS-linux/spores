[package]
name = "spore-worklog"
description = "Normalized cross-tool worklog events (fungos.worklog/event@1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "worklog"

# The receiver is a native host-side process, not a wasm component: it owns a
# socket and a file, which no Spore is allowed to own.
[[bin]]
name = "worklog"
path = "src/main.rs"

# The view host: the same Lua view the wall draws, served to a browser. It owns
# no state, so it is a second binary rather than a mode of the receiver —
# exposing the receiver's signed socket through the desktop gateway would put an
# ingest endpoint on the same origin as a page.
[[bin]]
name = "worklog-serve"
path = "src/bin/serve.rs"

[dependencies]
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
