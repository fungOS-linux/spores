[package]
name = "launcher-host"
description = "Wasmtime host for the installed Spore launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "launcher-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
# The catalogue is ours (discovery is host-side work); the manifest inside it
# is soil's. This replaced a git pin on `soil-spore-host`, a crate that does
# not exist on soil's main.
spore-catalog = { path = "../spore-catalog" }
