[package]
name = "launcher-host"
description = "Wasmtime host for the installed Spore launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "launcher-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
soil-spore-host = { git = "https://github.com/fungOS-linux/soil.git", rev = "4d4271b" }
