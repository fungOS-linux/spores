schema = 1

[spore]
id = "dev.fungos.notify"
name = "notify"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "Notification tray, focus mode and shared ringer"
description = "The tray for everything that wants attention: notifications, per-device focus profiles, and calls, doorbells, alarms and pages through one ringer."

[docs]
usage = ["notify", "notify --version"]
man = "docs/man.md"

[catalog]
categories = ["system", "communication"]
keywords = ["notifications", "tray", "focus", "ringer"]

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { notify = "1.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/tray.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "native", "web"]

[grants]
"soil:notify/inbox" = "read and act on the notification tray"
"soil:notify/focus" = "read and set per-device focus profiles"
"soil:notify/history" = "read opt-in notification history"
"soil:notify/cleanup" = "clear scoped notification sets"
"soil:notify/ringer" = "receive and answer calls, doorbells, alarms and pages"

"soil:notify" = "post a notification through the host tray"
"wasi:cli" = "Rust std diagnostics; no args, environment, or process launch"
"wasi:clocks" = "monotonic timing for the guest's scheduler"
"wasi:io" = "component-model async transport"
[denied]
"soil:notify/publisher" = ["the tray does not publish notifications"]
"soil:http" = ["network access is a separate explicit grant"]
