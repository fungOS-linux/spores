<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>files</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191919;color:#e9e9e7;font:13px ui-sans-serif,-apple-system,Helvetica,Arial,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #status{position:fixed;right:14px;bottom:10px;color:#6a6a6a;font-size:11px;pointer-events:none}
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="status">loading</div>
<script>
// The page draws the files Spore's scene document; it does not know what a VFS
// entry is. Nodes carry `transform.translation` / `transform.scale` in the
// -4..4 space and `ink` as a role, plus — because this document came from a
// preview — the resolved `rgb` and text `px`. A host resolves those two itself.
//
// A scene also carries `hits`: normalized press regions with an action and a
// payload. The view decides what a row means; this page only sends `files-open`
// back as the `path` the server already knows how to scan.
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
// Every frame is built off-screen and blitted in one call. The canvas on screen
// is never cleared, so there is no moment when it can show an empty or half-built
// scene — a repaint replaces every pixel at once or not at all.
const frame = document.createElement('canvas');
const paint = frame.getContext('2d');
const status = document.getElementById('status');
let dpr = 1, size = { w: 0, h: 0 };
let tag = null, inFlight = false, hits = [];
const params = new URLSearchParams(typeof location !== 'undefined' ? location.search : '');

// What a role means when the palette did not resolve it. A missing colour should
// look like a missing colour, not like invisible text.
const INKS = {
  background: '#0d0f14', surface: '#1e2430', text: '#e6ebf5', muted: '#8b96ab',
  primary: '#f2f5fb', success: '#a6da95', warning: '#eed49f', info: '#7dc4e4',
  danger: '#ed8796',
};

function fillOf(node) {
  const alpha = node.opacity ?? 1;
  if (node.rgb) {
    const [r, g, b] = node.rgb;
    return `rgba(${r},${g},${b},${alpha})`;
  }
  const hex = INKS[node.ink] || INKS.text;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

// Resizing a canvas clears it, so it happens only when the window actually
// changed size — never on a poll.
function fit() {
  const next = { w: innerWidth, h: innerHeight };
  if (next.w === size.w && next.h === size.h && canvas.width > 0) return false;
  dpr = window.devicePixelRatio || 1;
  size = next;
  canvas.width = Math.floor(size.w * dpr);
  canvas.height = Math.floor(size.h * dpr);
  frame.width = canvas.width;
  frame.height = canvas.height;
  return true;
}

function draw(scene, w, h) {
  paint.setTransform(dpr, 0, 0, dpr, 0, 0);
  paint.clearRect(0, 0, w, h);
  const xOf = (u) => (u + 4) / 8 * w;
  const yOf = (u) => (4 - u) / 8 * h;

  // Canvas sorts scene nodes by z and breaks ties by insertion order, so a stable
  // sort by z here paints the same picture. `radius` is a length in surface
  // pixels, like every other length the view hands over.
  const nodes = [...(scene.nodes || [])].sort(
    (a, b) => ((a.transform?.translation?.[2] ?? 0) - (b.transform?.translation?.[2] ?? 0)));

  for (const node of nodes) {
    const t = node.transform || {};
    const [x, y] = t.translation || [0, 0, 0];
    const [sx, sy] = t.scale || [1, 1, 1];
    paint.fillStyle = fillOf(node);
    if (node.type === 'rect') {
      const px = xOf(x), py = yOf(y);
      const rw = sx / 8 * w, rh = sy / 8 * h;
      const radius = Math.min(node.radius || 0, rw / 2, rh / 2);
      paint.beginPath();
      if (paint.roundRect) paint.roundRect(px, py, rw, rh, radius);
      else paint.rect(px, py, rw, rh);
      paint.fill();
    } else if (node.type === 'text') {
      paint.font = `${node.px}px ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif`;
      paint.textBaseline = 'top';
      paint.fillText(node.text || '', xOf(x), yOf(y));
    }
  }

  // One blit, one composite. No clear on the visible canvas: the scene paints its
  // own background, so the blit covers every pixel it is about to replace.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(frame, 0, 0);
}

// A hit rectangle is stored the way the view emitted it: `x` is the left edge
// and `y` the top edge in normalized scene units, with `w` and `h` positive. The
// y axis points up, so the rectangle extends from y down to y - h.
function targetAt(event) {
  const rect = canvas.getBoundingClientRect();
  const u = ((event.clientX - rect.left) / rect.width) * 8 - 4;
  const v = 4 - ((event.clientY - rect.top) / rect.height) * 8;
  for (const hit of hits) {
    if (u >= hit.x && u <= hit.x + hit.w && v <= hit.y && v >= hit.y - hit.h) return hit;
  }
  return null;
}

function navigate(hit) {
  const body = hit.body || {};
  if (hit.action !== 'files-open' && hit.action !== 'files-up') return;
  if (body.root) params.set('root', body.root);
  else params.delete('root');
  params.set('path', body.path || '');
  if (typeof history !== 'undefined' && history.replaceState) {
    history.replaceState(null, '', `?${params.toString()}`);
  }
  // A new directory is a new scene; the old tag names a body that no longer
  // matches it, and revalidating against it would only draw the wrong page.
  tag = null;
  refresh();
}

canvas.addEventListener('click', (event) => {
  const hit = targetAt(event);
  if (hit) navigate(hit);
});

async function refresh() {
  if (inFlight) return;
  inFlight = true;
  fit();
  const w = Math.round(size.w), h = Math.round(size.h);
  try {
    const query = new URLSearchParams({ w, h });
    if (params.get('root')) query.set('root', params.get('root'));
    if (params.get('path')) query.set('path', params.get('path'));
    const headers = tag ? { 'if-none-match': tag } : {};
    // `no-cache` means "revalidate before reuse", which is what makes the
    // conditional request meaningful; `no-store` makes the browser bypass its
    // cache entirely, and a bypassed cache has nothing to revalidate.
    const response = await fetch(`scene.json?${query}`, { cache: 'no-cache', headers });
    // Nothing to draw and nothing to say: the page stays exactly as it was, down
    // to the status line. Writing to the DOM on every poll repaints over a canvas
    // that did not need it.
    if (response.status === 304) return;
    if (!response.ok) throw new Error(`scene ${response.status}: ${await response.text()}`);
    const scene = await response.json();
    if (scene.error) throw new Error(scene.error);
    tag = response.headers.get('etag');
    hits = Array.isArray(scene.hits) ? scene.hits : [];
    draw(scene, w, h);
    status.textContent = `${scene.nodes.length} nodes · ${hits.length} targets · ${new Date().toLocaleTimeString()}`;
  } catch (error) {
    status.textContent = String(error.message || error);
  } finally {
    inFlight = false;
  }
}

let pending = 0;
addEventListener('resize', () => {
  clearTimeout(pending);
  pending = setTimeout(refresh, 120);
});

refresh();
// The scene is regenerated by the host from a scan, so polling is what keeps the
// page equal to the tree rather than equal to the moment I looked.
setInterval(refresh, 5000);
</script>
</body>
</html>
